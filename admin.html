<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý nội dung · Content admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles.css">
  <style>
    body { background: var(--color-bg); }
    .admin-header {
      position: sticky; top: 0; z-index: 20;
      background: var(--color-bg); border-bottom: 1px solid var(--color-divider);
    }
    .admin-header .inner {
      max-width: 1240px; margin: 0 auto; padding: 14px 32px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .admin-header .title {
      font-family: var(--font-heading); font-size: 19px; letter-spacing: 0.02em;
      margin-right: auto; text-transform: uppercase;
    }
    .saved-label {
      font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--color-accent-700); min-width: 60px; text-align: right;
    }
    .admin-layout {
      max-width: 1240px; margin: 0 auto; padding: 32px;
      display: grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: start;
    }
    .admin-tabs { position: sticky; top: 84px; display: grid; gap: 2px; }
    .admin-tab {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      width: 100%; text-align: left; cursor: pointer;
      font-family: var(--font-heading); font-size: 15px; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 9px 12px;
      border: 1px solid transparent; background: transparent; color: var(--color-text);
    }
    .admin-tab.active {
      border-color: var(--color-accent);
      background: var(--color-accent-100);
      color: var(--color-accent-800);
    }
    .admin-tab .count { opacity: 0.55; font-size: 12px; }
    .page-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 24px; flex-wrap: wrap;
      border-top: 1px solid var(--color-divider);
      padding-top: 18px; margin-bottom: 26px;
    }
    .page-head h1 { margin: 0 0 8px; font-size: 34px; text-transform: uppercase; }
    .page-head p { font-size: 14px; opacity: 0.7; max-width: 70ch; margin: 0; }
    .rows { display: grid; gap: 26px; }
    .row-card { padding: 24px; }
    .row-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .row-head .row-title {
      font-family: var(--font-heading); font-size: 13px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--color-accent-700); margin-right: auto;
    }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .fields .wide { grid-column: 1 / -1; }
    .empty {
      border: 1px dashed var(--color-divider); padding: 48px;
      text-align: center; font-size: 14px; opacity: 0.6;
    }
    @media (max-width: 860px) {
      .admin-layout { grid-template-columns: 1fr; }
      .admin-tabs { position: static; grid-template-columns: repeat(3, 1fr); }
      .fields { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="inner">
      <span class="title">Quản lý nội dung · Content admin</span>
      <span class="saved-label" id="saved-label"></span>
      <button class="btn btn-secondary btn-small" id="btn-export">Xuất JSON</button>
      <label class="btn btn-secondary btn-small" style="cursor: pointer;">
        Nhập JSON
        <input type="file" accept="application/json" id="input-import" style="display: none;">
      </label>
      <button class="btn btn-secondary btn-small" id="btn-reset">Khôi phục mẫu</button>
      <a class="btn btn-primary btn-small" href="./index.html">Xem trang</a>
    </div>
  </header>

  <div class="admin-layout">
    <nav class="admin-tabs" id="tabs"></nav>
    <main id="editor"></main>
  </div>

  <script type="module" src="./src/admin.js"></script>
</body>
</html>
