<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="bg-vignette"></div>

  <div id="page">
    <header class="site-header">
      <div class="inner">
        <a href="#top" class="brand" id="brand"></a>
        <nav class="site-nav" id="nav"></nav>
        <div class="header-actions">
          <button class="btn btn-secondary btn-small" id="lang-toggle"></button>
          <a class="btn btn-secondary btn-small" href="./admin.html" id="admin-link"></a>
        </div>
      </div>
    </header>

    <main id="top" class="container">
      <section class="hero" id="hero"></section>
      <section id="work" class="block"></section>
      <section id="services" class="block"></section>
      <section id="stack" class="split"></section>
      <section id="process" class="block"></section>
      <section id="testimonials" class="block"></section>
      <section id="writing" class="block"></section>
      <section id="contact" class="contact"></section>
    </main>

    <footer class="site-footer">
      <div class="inner" id="footer"></div>
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
